name: Build and deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 주 예약 실행은 Cloudflare Worker 크론(KST 07:31~21:31)이 workflow_dispatch로 호출. 아래는 늦게라도 도는 예비용.
    - cron: '45 23,5,11 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TZ: Asia/Seoul
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d81a9a24fbc4b590008a46a0ccdb12f8
      - name: IndexNow (new/updated URLs)
        continue-on-error: true
        run: node scripts/indexnow-recent.mjs
