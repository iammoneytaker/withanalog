name: Render video

# 수동 실행 전용. 사이트 배포(deploy.yml)와 무관하고, 결과 mp4는 Actions 아티팩트로만 남습니다.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'video/<slug>/scenes.json 의 slug'
        required: true
        default: 'mizuno-brand-story'

concurrency:
  group: video-${{ github.event.inputs.slug }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg (static) and Korean fonts
        run: |
          mkdir -p "$HOME/bin" "$HOME/.fonts"
          curl -sSL -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/bin/"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          for w in Bold Regular; do curl -sSL -o "$HOME/.fonts/NotoSansCJKkr-$w.otf" "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Korean/NotoSansCJKkr-$w.otf"; done
          fc-cache -f "$HOME/.fonts" >/dev/null
          fc-list | grep -i "CJK KR" | head -3
          "$HOME/bin/ffmpeg" -hide_banner -filters | grep -E " subtitles | zoompan " 
      - run: pip install -q edge-tts pillow
      - name: Render
        env:
          SLUG: ${{ github.event.inputs.slug }}
          FONT_DIR: /home/runner/.fonts
        run: |
          case "$SLUG" in *[!a-z0-9-]*) echo "bad slug"; exit 1;; esac
          python video/render.py "video/$SLUG" out
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}
          path: |
            out/*.mp4
            out/*.ass
          retention-days: 14
