name: Render video

# 수동 실행 전용. 사이트 배포(deploy.yml)와 무관하고, 결과 mp4는 Actions 아티팩트로만 남습니다.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'video/<slug>/scenes.json 의 slug'
        required: true
        default: 'mizuno-brand-story'

concurrency:
  group: video-${{ github.event.inputs.slug }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg and Korean fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-cjk
          fc-list | grep -c "Noto Sans CJK" || true
      - run: pip install -q edge-tts pillow
      - name: Render
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          case "$SLUG" in *[!a-z0-9-]*) echo "bad slug"; exit 1;; esac
          python video/render.py "video/$SLUG" out
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.slug }}
          path: |
            out/*.mp4
            out/*.ass
          retention-days: 14
